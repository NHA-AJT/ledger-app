<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>The Ledger</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#152220" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ledger" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <h1>The Ledger</h1>
  <div class="sub">a private log of writing, photos, audio &amp; video — stored on this device</div>
</header>

<main>
  <section id="composer">
    <textarea id="text-input" placeholder="Write something…"></textarea>
    <div class="composer-actions">
      <label class="icon-btn" title="Attach photo or video" for="file-input">📎</label>
      <input id="file-input" type="file" accept="image/*,video/*,audio/*" multiple hidden />
      <button id="mic-btn" class="icon-btn" title="Record a voice note">🎙</button>
      <div class="spacer"></div>
      <button id="save-btn" disabled>Log entry</button>
    </div>
    <div id="pending-media" class="pending-media"></div>
  </section>

  <div id="timeline"></div>

  <div id="storage-note"></div>
</main>

<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((err) => console.error('SW registration failed:', err));
    });
  }
</script>
</body>
</html>
